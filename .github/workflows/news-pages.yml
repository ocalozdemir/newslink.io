name: Haberleri yenile ve yayınla
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: haberlerim-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Önceki akışı getir
        uses: actions/cache@v4
        with:
          path: .news-cache
          key: news-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-${{ github.ref_name }}-
      - name: Toplayıcı kontrolleri
        run: python -m unittest discover -s tests -v
      - name: Haberleri topla
        run: python scripts/fetch_news.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: GitHub Pages yayını
        id: deployment
        uses: actions/deploy-pages@v4
